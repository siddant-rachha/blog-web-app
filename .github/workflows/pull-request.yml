name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Create .env file dynamically
        run: |
          touch .env.local
          for secret in $(printenv | awk -F= '{print $1}'); do
            echo "$secret=${!secret}" >> .env.local
          done
        env: ${{ toJson(secrets) }}

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run format
        run: npm run format

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build
